  }
  function update(dt){frame+=dt; clouds=clouds.filter(c=>c.x>-40);if(Math.random()<.012)clouds.push({x:W,y:40+Math.random()*75});clouds.forEach(c=>c.x-=speed*.18*dt);
    if(state==='playing'){playTime+=dt/60;score+=dt*.12;speed=Math.min(10.5,4+score/180);redSportSpawnIn-=dt;if(redSportSpawnIn<=0)spawnRedSport();if(blackSUVs.length){blackSUVs.forEach(s=>{if(s.knocked){s.x+=(s.flySpeed-speed)*dt;s.flyVy+=.38*dt;s.flyY+=s.flyVy*dt;s.spin+=.16*dt;}else{s.x-=speed*dt;}});blackSUVs=blackSUVs.filter(s=>s.x+s.w>0&&s.x<W+120);}else{suvSpawnIn-=dt;if(suvSpawnIn<=0)spawnBlackSUV();}spawnIn-=dt;if(spawnIn<=0)spawn();rallySpawnIn-=dt;if(rallySpawnIn<=0&&rallyCars.length===0)spawnRallyCar();rallyCars.forEach(v=>{if(v.knocked){v.x+=(v.flySpeed-speed)*dt;v.flyVy+=.38*dt;v.flyY+=v.flyVy*dt;v.spin+=.16*dt;}else{v.x-=speed*dt;if(!v.thrown){v.throwIn-=dt;if(v.throwIn<=0){v.thrown=true;thrownBlocks.push({x:v.x+4,y:ground-13,w:48,h:10,vx:Math.max(15,speed+6.75),phase:'flying',t:0,targetX:Math.max(-30,2*(car.x+car.w+34)-(v.x+4))});}}}});rallyCars=rallyCars.filter(v=>v.x+v.w>0&&v.x<W+120);thrownBlocks.forEach(b=>{if(b.phase==='flying'){b.x=Math.max(b.targetX,b.x-b.vx*dt);if(b.x<=b.targetX){b.phase='igniting';b.t=0;}}else{b.t+=dt;if(b.phase==='igniting'&&b.t>=8){b.phase='explosion';b.t=0;}else if(b.phase==='explosion'&&b.t>=24)b.phase='done';}});thrownBlocks=thrownBlocks.filter(b=>b.phase!=='done'&&b.x+b.w>-30);if(playTime>=50){airSpawnIn-=dt;if(airSpawnIn<=0){spawnAirCar();airSpawnIn=420+Math.random()*300;}}airCars.forEach(o=>{o.x-=o.vx*dt;o.dropIn-=dt;if(o.dropIn<=0&&!o.dropped){o.dropped=true;airBlocks.push({x:o.x+10+Math.random()*(o.w-30),y:o.y+o.h-8,w:48,h:10,vy:1.8+Math.random()*1.2,vx:-2+Math.random()*2});airDropAudio.currentTime=0;airDropAudio.play().catch(()=>{});}});airCars=airCars.filter(o=>o.x+o.w>0&&o.x<W+200);airBlocks.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;});airBlocks=airBlocks.filter(b=>b.y+b.h<ground);obstacles.forEach(o=>{if(o.knocked){o.x+=(o.flySpeed-speed)*dt;o.flyVy+=.38*dt;o.flyY+=o.flyVy*dt;o.spin+=.16*dt;}else{const trafficSpeed=speed+(o.type==='红色跑车'?0:(playTime>=90?3:playTime>=45?1.5:0));o.x-=trafficSpeed*(o.speedMultiplier||1)*dt;if(o.type==='红色跑车'){if(!o.jumped&&o.x<car.x+car.w+110){o.jumped=true;o.jumpT=0;}if(o.jumped&&o.jumpT<22){o.jumpT+=dt;const p=Math.min(1,o.jumpT/22);o.jumpY=(playTime>=150?63:42)*4*p*(1-p);o.wheelBounce=Math.sin(p*Math.PI)*3;if(o.jumpT>=22){o.jumpY=0;o.wheelBounce=0;}}}}});obstacles=obstacles.filter(o=>o.x+o.w>0&&o.x<W+120);
      if(firstMpvWarning>0){firstMpvWarning-=dt;if(firstMpvWarning<=0)spawnMpv(pendingMpvDirection);}
      else if(mpvs.length===0){mpvSpawnIn-=dt;if(mpvSpawnIn<=0&&canSpawnSpecial('mpv')){if(!firstMpvMusicDone){firstMpvMusicDone=true;pendingMpvDirection=1;pendingMpvMusic=0;}else{pendingMpvDirection=Math.random()<.5?1:-1;pendingMpvMusic=Math.floor(Math.random()*mpvAudios.length);}playMpvMusic(pendingMpvMusic);firstMpvWarning=30;}}
      mpvs.forEach(v=>{v.x+=v.v*dt;const myY=ground-v.h;for(const o of obstacles){if(!o.knocked&&v.x+v.w>o.x+5&&v.x<o.x+o.w-5){o.knocked=true;o.flySpeed=v.direction>0?v.v+4:v.v-4;o.flyVy=-8-Math.random()*2;o.flyY=0;o.spin=0;}}for(const r of rallyCars){if(!r.knocked&&v.x+v.w>r.x+4&&v.x<r.x+r.w-4&&myY+5<r.y+r.h&&myY+v.h-5>r.y){r.knocked=true;r.flySpeed=v.direction>0?v.v+4:v.v-4;r.flyVy=-8-Math.random()*2;r.flyY=0;r.spin=0;}}for(const s of blackSUVs){if(!s.knocked&&v.x+v.w>s.x+4&&v.x<s.x+s.w-4&&myY+5<s.y+s.h&&myY+v.h-5>s.y){s.knocked=true;s.flySpeed=v.direction>0?v.v+4:v.v-4;s.flyVy=-8-Math.random()*2;s.flyY=0;s.spin=0;}}const safelyPassed=v.direction>0?v.x>car.x+car.w:v.x+v.w<car.x;if(!v.cleared&&safelyPassed){v.cleared=true;doubleCharges+=2;trickEl.textContent=doubleCharges+'次';hint.textContent='躲过来车！获得 2 次二段跳';}const exited=v.direction>0?v.x>=W:v.x+v.w<=0;if(exited){stopMpvMusic();}});mpvs=mpvs.filter(v=>v.direction>0?v.x<W+20:v.x+v.w>0);
      const grounded=car.y>=ground-car.h-1;
      if(boostHeld&&air>0){air=Math.max(0,air-dt);car.vy=grounded?-6.2:-3.6;car.y=Math.max(0,car.y+car.vy*dt);}
      else{car.vy+=.38*dt;car.y=Math.min(ground-car.h,car.y+car.vy*dt);if(car.y>=ground-car.h){car.vy=0;air=maxAir;}else air=Math.max(0,air-dt*.5);}
      const crash=(byMpv=false)=>{state='over';stopMpvMusic();if(byMpv){let au=mpvCrashCount===0?mpvImpactAudios[3]:mpvImpactAudios[Math.floor(Math.random()*4)];mpvCrashCount++;au.currentTime=0;au.play().catch(()=>{});}else{impactAudio.pause();impactAudio.currentTime=0;}hint.textContent='撞上啦，按住空格或触屏重新起飞';best=Math.max(best,Math.floor(score));localStorage.setItem('sproutSprintBest',best);};
      for(const o of obstacles){const pad=10;if(!o.knocked&&car.x+pad<o.x+o.w-3&&car.x+car.w-pad>o.x+3&&car.y<ground-(o.jumpY||0)&&car.y+car.h-4>ground-o.h-(o.jumpY||0)){crash();break;}}
      if(state==='playing')for(const v of rallyCars){if(!v.knocked&&car.x+10<v.x+v.w-4&&car.x+car.w-8>v.x+4&&car.y+car.h-4>v.y){crash();break;}}
      if(state==='playing')for(const b of thrownBlocks){if(car.x+10<b.x+b.w&&car.x+car.w-8>b.x&&car.y+car.h-2>b.y&&car.y<b.y+b.h+12){crash();break;}}
      if(state==='playing')for(const v of mpvs){if(car.x+11<v.x+v.w-5&&car.x+car.w-10>v.x+5&&car.y+car.h-4>ground-v.h){crash(true);break;}}
      if(state==='playing')for(const s of blackSUVs){if(!s.knocked&&car.x<s.x+s.w&&car.x+car.w>s.x&&car.y<s.y+s.h&&car.y+car.h>s.y){crash();break;}}if(state==='playing')for(let bi=0;bi<airBlocks.length;bi++){const b=airBlocks[bi];if(car.x+10<b.x+b.w-3&&car.x+car.w-10>b.x+3&&car.y<b.y+b.h-4&&car.y+car.h-4>b.y){air=0;if(playTime>=300)doubleCharges=0;trickEl.textContent=doubleCharges+'次';airBlocks.splice(bi,1);break;}}
      best=Math.max(best,Math.floor(score));
    }
    if(rollFrames>0)rollFrames=Math.max(0,rollFrames-dt);
    scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');timerEl.textContent=Math.floor(playTime/60)+'分'+String(Math.floor(playTime%60)).padStart(2,'0')+'秒';bestEl.textContent=String(best).padStart(5,'0');fuelEl.textContent=(air/60).toFixed(1)+'秒';
  }
  function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);paint();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
